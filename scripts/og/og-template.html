<!doctype html>
<!--
  Template for public/og-image.jpg — the picture shown when the invitation
  link is shared on WhatsApp, Facebook, iMessage, etc.

  To regenerate after changing names or the date:
    1. Run `npm install` (fonts are read from node_modules).
    2. Open this file in Chrome, open DevTools → device toolbar, set the size to
       1200 × 630 and zoom 100%, then use “Capture screenshot”.
    3. Convert to JPG (quality ~82, under 300 KB) and save as public/og-image.jpg.
  Any other 1200 × 630 JPG (for example a photo of the couple) works too.
-->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>Sharing image</title>
    <style>
      @font-face {
        font-family: 'Aref Ruqaa';
        font-weight: 700;
        src: url(../../node_modules/@fontsource/aref-ruqaa/files/aref-ruqaa-arabic-700-normal.woff2) format('woff2');
      }
      @font-face {
        font-family: 'Amiri';
        font-weight: 400;
        src: url(../../node_modules/@fontsource/amiri/files/amiri-arabic-400-normal.woff2) format('woff2');
      }
      @font-face {
        font-family: 'Cormorant Garamond';
        font-weight: 300;
        font-style: italic;
        src: url(../../node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-300-italic.woff2) format('woff2');
      }
      @font-face {
        font-family: 'Cormorant Garamond';
        font-weight: 400;
        src: url(../../node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-400-normal.woff2) format('woff2');
      }
      @font-face {
        font-family: 'Jost';
        font-weight: 500;
        src: url(../../node_modules/@fontsource/jost/files/jost-latin-500-normal.woff2) format('woff2');
      }
      :root {
        --ivory: #f8f1e9;
        --cream: #f1e5da;
        --paper: #fbf7f1;
        --navy: #172343;
        --gold: #b99a66;
        --gold-ink: #84663a;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        background: radial-gradient(70% 90% at 50% 45%, var(--paper) 0%, var(--ivory) 50%, var(--cream) 100%);
        font-family: 'Amiri', serif;
        color: var(--navy);
        font-variant-numeric: lining-nums;
      }
      .flora {
        position: absolute;
        pointer-events: none;
      }
      .card {
        position: absolute;
        left: 50%;
        top: 22px;
        width: 400px;
        height: 586px;
        transform: translateX(-50%);
        filter: drop-shadow(0 20px 30px rgb(110 85 50 / 0.16));
      }
      #arch {
        position: absolute;
        inset: 0;
        overflow: visible;
      }
      .content {
        position: absolute;
        inset: 84px 30px 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .basmala {
        font-size: 19px;
        opacity: 0.8;
        margin-top: 14px;
      }
      .occasion {
        font-family: 'Aref Ruqaa', serif;
        font-weight: 700;
        color: var(--gold-ink);
        font-size: 34px;
        line-height: 1.4;
        margin-top: 10px;
      }
      .names {
        font-family: 'Aref Ruqaa', serif;
        font-weight: 700;
        font-size: 74px;
        line-height: 1;
        margin-top: 4px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .amp {
        font-family: 'Cormorant Garamond', serif;
        font-style: italic;
        font-weight: 300;
        color: var(--gold);
        font-size: 40px;
        line-height: 1;
        margin: 6px 0 -18px;
      }
      .date {
        font-family: 'Cormorant Garamond', serif;
        font-size: 26px;
        letter-spacing: 0.32em;
        margin-top: 14px;
        direction: ltr;
      }
      .latin {
        font-family: 'Jost', sans-serif;
        font-weight: 500;
        font-size: 13px;
        letter-spacing: 0.34em;
        color: var(--gold-ink);
        margin-top: 12px;
        direction: ltr;
      }
      .sep {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 30px;
        direction: ltr;
      }
      .sep i {
        display: block;
        width: 54px;
        height: 1px;
      }
    </style>
  </head>
  <body>
    <img class="flora" src="../../src/assets/decor/gypsophila-corner.svg" style="right: -40px; top: -60px; width: 430px; transform: scale(-1, -1)" alt="" />
    <img class="flora" src="../../src/assets/decor/gypsophila-corner-alt.svg" style="left: -40px; bottom: -70px; width: 430px" alt="" />

    <div class="card">
      <svg id="arch" width="400" height="586"></svg>
      <div class="content">
        <svg width="28" height="28" viewBox="0 0 100 100" fill="none" stroke="#b99a66" stroke-width="3">
          <rect x="21" y="21" width="58" height="58" />
          <rect x="21" y="21" width="58" height="58" transform="rotate(45 50 50)" />
          <circle cx="50" cy="50" r="17" />
          <circle cx="50" cy="50" r="4" fill="#b99a66" stroke="none" />
        </svg>
        <div class="basmala">بسم الله الرحمن الرحيم</div>
        <div class="occasion">عقد قران</div>
        <div class="names">
          <span>رانية</span>
          <span class="amp">&amp;</span>
          <span>سعيد</span>
        </div>
        <div class="sep">
          <i style="background: linear-gradient(to right, transparent, #b99a66)"></i>
          <svg width="34" height="12" viewBox="0 0 34 12" fill="none">
            <circle cx="3" cy="6" r="1.3" fill="#b99a66" />
            <path d="M17 1 L22 6 L17 11 L12 6 Z" stroke="#b99a66" stroke-width="0.9" />
            <circle cx="17" cy="6" r="1.4" fill="#b99a66" />
            <circle cx="31" cy="6" r="1.3" fill="#b99a66" />
          </svg>
          <i style="background: linear-gradient(to left, transparent, #b99a66)"></i>
        </div>
        <div class="date">12 / 12 / 2026</div>
        <div class="latin">RANIA &amp; SAID</div>
      </div>
    </div>

    <script>
      // Same pointed-arch geometry as src/components/decorative/ArchFrame.tsx.
      function archPath(x, y, w, h, p) {
        const half = w / 2;
        const r = w * p;
        const apex = Math.sqrt(r * r - (r - half) * (r - half));
        const spring = y + Math.min(apex, h * 0.6);
        return `M${x} ${y + h} L${x} ${spring} A${r} ${r} 0 0 1 ${x + half} ${spring - apex} A${r} ${r} 0 0 1 ${x + w} ${spring} L${x + w} ${y + h} Z`;
      }
      const W = 400, H = 586, y0 = 18, gap = 7;
      document.getElementById('arch').innerHTML = `
        <path d="${archPath(0.5, y0, W - 1, H - y0 - 0.5, 0.62)}" fill="rgb(253 251 247 / 0.85)" stroke="#b99a66" stroke-width="1.2"/>
        <path d="${archPath(gap + 0.5, y0 + gap, W - 2 * gap - 1, H - y0 - 2 * gap - 0.5, 0.62)}" fill="none" stroke="#b99a66" stroke-opacity="0.55" stroke-width="0.9"/>
        <g transform="translate(${W / 2} ${y0})" stroke="#b99a66" stroke-width="1">
          <path d="M0 -3 L0 -12"/><path d="M0 -17 L3.2 -12.5 L0 -8 L-3.2 -12.5 Z" fill="#fbf7f1"/>
          <circle cx="0" cy="-1.5" r="1.4" fill="#b99a66" stroke="none"/>
        </g>`;
    </script>
  </body>
</html>
